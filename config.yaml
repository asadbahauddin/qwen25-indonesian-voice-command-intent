# =====================================================================
# Konfigurasi pipeline perintah suara -> JSON robot
# Satu file untuk laptop (dev) dan Raspberry Pi 5 (target).
# Ganti nilai di sini, BUKAN di kode.
# =====================================================================

paths:                       # relatif terhadap folder file config ini
  recordings: recordings
  results: results
  logs: logs

logging:
  level: INFO                # DEBUG | INFO | WARNING | ERROR
  console: true              # juga cetak log ke layar

# ---------------------------------------------------------------------
# FASE 1 - Akuisisi audio
# ---------------------------------------------------------------------
audio:
  # Perangkat input: indeks (int), substring nama (str), atau null = default OS.
  # Disarankan substring nama, karena indeks berubah antar-colokan/OS.
  # Lihat daftar: python bench/tes_mic.py --list
  device: "USBAudio1.0"      # receiver wireless lavalier (USB VID_4C4A PID_4155), dicek 11 Nov 2026
  # Filter host API (substring) bila nama perangkat muncul di beberapa API.
  # Windows: "WASAPI" atau "MME" | Linux/RPi: "ALSA" | null = tanpa filter
  hostapi: "WASAPI"
  # null = pakai sample rate native perangkat (disarankan; 44100/48000)
  capture_samplerate: null
  # null = semua kanal input perangkat; downmix ke mono setelahnya
  capture_channels: null
  # null = rata-rata semua kanal; int = ambil satu kanal (0 = kiri)
  mono_channel: null
  target_samplerate: 16000   # wajib 16 kHz untuk Silero VAD & Whisper
  block_ms: 32               # ukuran blok callback PortAudio
  latency: low               # "low" | "high" | detik (float)
  resample_quality: HQ       # soxr: QQ | LQ | MQ | HQ | VHQ
  queue_max_blocks: 200      # buffer antrean callback (~6,4 s @ 32 ms)
  wav_subtype: PCM_16        # format simpan WAV

# Ambang analisis level (bench/tes_mic.py)
levels:
  window_ms: 100             # jendela RMS untuk statistik per-jendela
  clip_threshold: 0.999      # |x| >= nilai ini dihitung clipping (full scale = 1.0)
  noise_percentile: 10       # persentil RMS jendela ~ noise floor
  speech_percentile: 90      # persentil RMS jendela ~ level ucapan
  near_full_scale: 0.98      # |x| >= nilai ini = menyentuh limiter (dihitung pada sinyal native)
  gate_floor_dbfs: -85       # RMS rekaman diam di bawah ini -> noise gate aktif, SNR tidak representatif

bench:
  mic_test_seconds: 5
  mic_countdown_seconds: 3   # hitung mundur sebelum tiap rekaman
  # Kondisi uji mikrofon F1 (nama -> instruksi untuk penutur)
  mic_conditions:
    diam:   "DIAM, jangan bicara (mengukur noise ruangan)"
    normal: "Bicara NORMAL seperti memberi perintah ke robot"
    keras:  "Bicara KERAS / setengah berteriak (cek clipping)"
  # Batas peringatan kualitas rekaman
  mic_warn:
    min_snr_db: 20           # SNR normal-vs-diam di bawah ini -> peringatan
    min_speech_peak_dbfs: -30   # puncak ucapan normal di bawah ini -> terlalu pelan

# ---------------------------------------------------------------------
# FASE 4 - NLU (path relatif terhadap root repo)
# ---------------------------------------------------------------------
nlu:
  domain_vocab: config/domain_id.yaml   # nilai entity kanonik + alias
  qwen:
    host: http://localhost:11434        # Ollama HTTP API
    model: qwen2.5:1.5b                 # Q4_K_M (cek: ollama show qwen2.5:1.5b)
    prompt_version: v1        # versi aktif (final 11 Nov: EM dan latency lebih baik dari v2); daftar di bawah
    prompts:
      v1: {file: prompts/system_id.txt, plan_field: false}      # F4, 6 contoh
      v2: {file: prompts/system_id_v2.txt, plan_field: true}    # F6: field 'tindakan' dulu, 8 contoh
    use_schema: true          # true = structured output Ollama (keluaran dibatasi JSON schema)
    schema_version: v2        # v1 = longgar (F4/F6 awal), v2 = struktur dikunci per intent
    temperature: 0            # deterministik untuk evaluasi
    seed: 42
    num_ctx: 2048             # cukup untuk system prompt + 1 kalimat; hemat RAM di RPi 5
    num_predict: 256          # batas token keluaran
    keep_alive: 30m           # model tetap di memori antar-perintah
    timeout_s: 120
  rule:
    keywords: config/keywords_id.yaml   # kamus intent + penghubung klausa (entity dari domain_vocab)
  indobert:
    base_model: models/indobert-base-p1     # salinan lokal indobenchmark/indobert-base-p1 (offline)
    model_dir: models/indobert_intent       # hasil fine-tuning (klasifikasi intent)
    train_data: data/indobert_train.jsonl
    device: auto              # auto | cuda | cpu
    max_len: 64
    epochs: 8
    batch_size: 16
    lr: 3.0e-5
    weight_decay: 0.01
    warmup_ratio: 0.1
    val_ratio: 0.15           # dari data latih, untuk memilih epoch terbaik (BUKAN data uji)
    seed: 42

# ---------------------------------------------------------------------
# FASE 8 - Perekaman dataset (bench/rekam_dataset.py)
# ---------------------------------------------------------------------
vad:
  onnx: true                  # F2: onnx 0,24 vs torch 0,33-0,47 ms/frame, SD lebih kecil, selisih prob 1e-5 (results/vad_MSI_20261112_014026.md)
  threads: 1                  # thread torch untuk VAD (ringan; sisakan CPU untuk Whisper/Qwen)
  threshold: 0.5              # p(ucapan) >= threshold -> ucapan (bawaan Silero)
  neg_offset: 0.15            # histeresis: diam bila p < threshold - neg_offset (sama dengan Silero)
  pre_roll_ms: 300            # audio sebelum pemicu ikut diambil (awal kata lemah)
  min_silence_ms: 800         # diam sepanjang ini = ujaran selesai (penentu jeda akhir)
  post_pad_ms: 200            # sisa diam di ekor ujaran
  min_speech_ms: 250          # ujaran lebih pendek dibuang (klik/batuk)
  max_utterance_s: 15         # potong paksa

asr:
  backend: faster             # faster = faster-whisper (CTranslate2) | openai = openai-whisper (PyTorch); final dipilih di F3 (WER + latency)
  model: base                 # proposal: Whisper base; /whisper base|small di CLI
  models_dir: models/whisper  # unduhan model faster-whisper; openai-whisper memakai ~/.cache/whisper
  language: id
  device: auto                # auto = cuda bila ada, selain itu cpu
  compute_type: {cuda: float16, cpu: int8}   # faster-whisper; openai-whisper: fp16 di cuda, fp32 di cpu
  cpu_threads: 0              # 0 = bawaan pustaka
  beam_size: 5
  temperature: 0.0            # tanpa fallback suhu -> deterministik
  condition_on_previous_text: false   # cegah halusinasi berantai
  without_timestamps: true
  use_initial_prompt: true
  initial_prompt_file: prompts/whisper_initial_id.txt   # hanya daftar nama entity domain (bukan kalimat dataset)

dataset:
  skenario: bench/skenario_dataset.json   # mode skenario (kalimat bebas responden)
  pilot: bench/pilot_set.json             # mode baca (membaca kalimat pilot)
  out_skenario: dataset                   # audio + metadata responden (TIDAK di-push: privasi)
  out_baca: recordings/pilot_audio        # audio pilot yang dibacakan
  max_record_s: 15          # rekaman otomatis berhenti setelah ini
  min_record_s: 0.6         # lebih pendek dari ini -> diminta ulang
  tail_ms: 300              # tetap merekam sebentar setelah Enter kedua (ujung kata tidak terpotong)
  min_peak_dbfs: -30        # puncak di bawah ini -> peringatan terlalu pelan
